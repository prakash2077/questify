<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#000"/>

  <!-- The System diamond, glowing -->
  <g transform="rotate(45 256 256)">
    <rect x="126" y="126" width="260" height="260" fill="none" stroke="#2f7bff" stroke-width="22" filter="url(#glow)" opacity="0.9"/>
    <rect x="126" y="126" width="260" height="260" fill="#061229" stroke="#2f7bff" stroke-width="14"/>
  </g>

  <!-- The bonfire flame -->
  <g transform="translate(166 150) scale(1.8)">
    <path fill="url(#flame)" d="M50 6 C58 28 82 40 82 66 C82 85 67 98 50 98 C33 98 18 85 18 66 C18 51 27 42 33 31 C36 42 40 47 45 47 C42 32 44 18 50 6 Z"/>
    <path fill="#ffe27a" d="M50 52 C56 62 65 68 65 79 C65 89 58 95 50 95 C42 95 35 89 35 79 C35 70 44 64 50 52 Z"/>
  </g>
</svg>
