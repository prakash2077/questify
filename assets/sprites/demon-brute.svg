    <path d="M130 52 C152 52 168 66 172 88 L176 112 C196 112 226 122 244 150 L260 240 L0 240 L16 150 C34 122 64 112 84 112 L88 88 C92 66 108 52 130 52 Z" fill="url(#hide)"/>
